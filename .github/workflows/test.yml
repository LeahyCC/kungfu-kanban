name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  suite:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test --experimental-test-coverage
  layout:
    # Real-browser phone layout check (npm run test:layout) — kept out of the
    # `suite` job above since it downloads a Chromium build on every run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:layout
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # full history + tags — the release audit walks them
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check-release.js
  test:
    needs: [suite, layout, release-check]
    runs-on: ubuntu-latest
    steps:
      - run: exit 0
  # One merged PR, one release. Runs only after everything above is green, and
  # only on main; a PR that bumped no version (or left its notes under
  # [Unreleased]) is a silent no-op. Tag + Release only — never a commit, so
  # main's ruleset can't block it. See scripts/cut-release.js.
  release:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write     # push the annotated tag, publish the Release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # full history + tags — cut-release checks them
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/cut-release.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
